[project]
name = "agentbench"
version = "0.0.1"
description = "Compare coding agents (model + CLI) on checkable tasks: time, tokens, dollar-equivalent, pass/fail."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TayHCode" }]
dependencies = []

[project.scripts]
agentbench = "agentbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = []

[tool.setuptools.package-data]
agentbench = ["prices.toml"]

[tool.setuptools.cmdclass]
build_py = "build_tasks.BuildWithTasks"
